name: Publish to npm

# Publishing is deliberately NOT on every push to main. A version on npm is
# permanent — you cannot re-publish over one — so it is tied to an explicit
# GitHub Release, or a manual run for when something needs pushing by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm attach a signed provenance attestation: proof that this tarball was
  # built by this workflow, from this public repository, at this commit. It is
  # what stops someone publishing a different tarball under this name.
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci
        env:
          # The published package ships a prebuilt dist; nothing here launches a
          # browser, so downloading Chrome would only slow the job down.
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # A release tag that disagrees with package.json publishes the wrong
      # version under the right name, and npm will not let you take it back.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag '$TAG' does not match package.json version '$PKG'"
            echo "Bump with 'npm version <patch|minor|major>', push the tag, then release it."
            exit 1
          fi
          echo "publishing $PKG"

      - name: Typecheck
        run: npm run typecheck

      # prepublishOnly runs build:all, which compiles the CLI and builds the SPA
      # into dist/web. Running it here too means a failure surfaces as a build
      # error rather than midway through publishing.
      - name: Build
        run: npm run build:all

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # A granular or automation token. This is the whole point of publishing
          # from CI: those tokens bypass the interactive 2FA prompt that npm now
          # requires, so no OTP has to be typed and no long-lived credential sits
          # on a laptop.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
